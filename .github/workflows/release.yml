name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_AUTH_CALLBACK_URL: ${{ secrets.VITE_CLERK_AUTH_CALLBACK_URL }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Paperite-*.AppImage,dist/paperite-*.tar.gz
          generate_release_notes: true
