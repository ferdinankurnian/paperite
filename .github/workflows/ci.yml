name: CI

on:
  push:
    branches: [v0.2.0]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc -b
      - run: bunx biome check src main.js preload.js --max-diagnostics=50 || true
      - run: bun test
